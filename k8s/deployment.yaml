apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cost
  template:
    metadata:
      labels:
        app: cost
    spec:
      containers:
        - name: api
          image: cost-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: cost-config}
            - secretRef: {name: cost-secrets}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512000000Mi}
            limits: {cpu: "1", memory: 20000000Gi}
